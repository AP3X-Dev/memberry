name: LAB-013 production-control qualification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed LAB-013 source and workflow commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify-control:
    name: Evidence on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Bind workflow definition to requested source and initialize evidence tombstone
        shell: bash
        env:
          LAB013_SOURCE_SHA: ${{ inputs.source_sha }}
          LAB013_RECEIPT_PATH: ${{ runner.temp }}/lab013-control/receipt-node${{ matrix.node-version }}.json
        run: |
          mkdir -p "$(dirname "$LAB013_RECEIPT_PATH")"
          source_json=null
          workflow_json=null
          [[ "$LAB013_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] && source_json="\"$LAB013_SOURCE_SHA\""
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] && workflow_json="\"$GITHUB_SHA\""
          printf '{\n  "schemaVersion": "1.0.0",\n  "kind": "lab013-control-qualification-node-evidence-failure",\n  "outcome": "rejected",\n  "failureCode": "source-preflight-failed",\n  "executedSourceSha": %s,\n  "workflowRefSha": %s,\n  "workflowRun": { "id": "%s", "url": "https://github.com/%s/actions/runs/%s", "attempt": %s },\n  "runtime": { "execution": "hosted", "platform": "linux", "nodeMajor": %s },\n  "disclosure": "closed-aggregate-only"\n}\n' \
            "$source_json" "$workflow_json" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" "${{ matrix.node-version }}" >"$LAB013_RECEIPT_PATH"
          [[ "$source_json" != null ]]
          [[ "$GITHUB_SHA" == "$LAB013_SOURCE_SHA" ]]

      - name: Check out exact bound source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: No-dependency source, control, and candidate-absence preflight
        shell: bash
        env:
          LAB013_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$LAB013_SOURCE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$LAB013_SOURCE_SHA" ]]
          git merge-base --is-ancestor a90d8a91aa0ec5f10796938798537aafc2ed0b9c "$LAB013_SOURCE_SHA"
          expected="$(cat <<'PATHS' | LC_ALL=C sort
          .github/workflows/lab013-control-qualification.yml
          bench/lab/ROADMAP.md
          bench/lab/datasets/__tests__/load-multihop-v2.test.ts
          bench/lab/datasets/load-multihop-v2.ts
          bench/lab/datasets/multihop/v2/dev/input.jsonl
          bench/lab/datasets/multihop/v2/dev/oracle.jsonl
          bench/lab/datasets/multihop/v2/holdout/input.jsonl
          bench/lab/datasets/multihop/v2/holdout/oracle.jsonl
          bench/lab/multihop/__tests__/qualify-control-v2.test.ts
          bench/lab/multihop/__tests__/scorer-only-v2.test.ts
          bench/lab/multihop/policy-v2.ts
          bench/lab/multihop/qualify-control-v2.ts
          bench/lab/multihop/scorer-only-v2.ts
          bench/lab/registry/datasets.json
          package.json
          PATHS
          )"
          actual="$(git diff --name-only a90d8a91aa0ec5f10796938798537aafc2ed0b9c "$LAB013_SOURCE_SHA" | LC_ALL=C sort)"
          [[ "$actual" == "$expected" ]]
          [[ "$(git rev-parse "$LAB013_SOURCE_SHA:bench/lab/adapters/memberry-retrieval-core.ts")" == 3ceda0bcc44a5e7a8d79356c5ec909451d426a02 ]]
          [[ "$(git rev-parse "$LAB013_SOURCE_SHA:bench/lab/registered-adapters.ts")" == 752bc02e4ef5aabe99a5c52699c2ead6e6395f83 ]]
          [[ "$(git rev-parse "$LAB013_SOURCE_SHA:bench/lab/runner.ts")" == c0b885845d117f1d6e7a25bbfc87832e97ddee77 ]]
          [[ "$(git rev-parse "$LAB013_SOURCE_SHA:bench/lab/registry/systems.json")" == 41ccf2b5e8a6c90d5f675d56c2b641126d151f82 ]]
          [[ "$(git rev-parse "$LAB013_SOURCE_SHA:bench/lab/registry/experiments.json")" == 9dda1d33d84611cdc9c388fb81df5d8a678798a2 ]]
          python3 - <<'PY'
          import json, re
          marker = re.compile(r"lab-?013|multi-?hop-v2|multihop-v2", re.I)
          def load(path):
              with open(path, encoding="utf-8") as handle:
                  return json.load(handle)
          systems = load("bench/lab/registry/systems.json")["systems"]
          experiments = load("bench/lab/registry/experiments.json")["experiments"]
          assert not any(marker.search(json.dumps(value, sort_keys=True)) for value in systems + experiments)
          datasets = [value for value in load("bench/lab/registry/datasets.json")["datasets"]
                      if str(value.get("id", "")).startswith("memberry-multihop-v2-")]
          assert {value["id"] for value in datasets} == {
              "memberry-multihop-v2-dev", "memberry-multihop-v2-holdout"
          }
          for value in datasets:
              split = value["split"]
              identities = {
                  f'{item.get("role")}|{item.get("access")}|{item.get("repositoryPath")}'
                  for item in value.get("artifacts", [])
              }
              assert identities == {
                  f"input|adapter|bench/lab/datasets/multihop/v2/{split}/input.jsonl",
                  f"oracle|scorer|bench/lab/datasets/multihop/v2/{split}/oracle.jsonl",
              }
          PY

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install frozen dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Prove installation did not mutate or add source
        shell: bash
        env:
          LAB013_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$LAB013_SOURCE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$LAB013_SOURCE_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]

      - name: Run only the registered production control over dev and sealed holdout
        env:
          LAB013_SOURCE_SHA: ${{ inputs.source_sha }}
          LAB013_RECEIPT_PATH: ${{ runner.temp }}/lab013-control/receipt-node${{ matrix.node-version }}.json
          MEMBERRY_LAB_CANDIDATE: "false"
        run: npm run bench:lab:multihop-v2:qualify-control

      - name: Upload closed node evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab013-control-node-evidence-node${{ matrix.node-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab013-control/receipt-node${{ matrix.node-version }}.json
          if-no-files-found: error
          retention-days: 30

  finalize-qualification:
    name: Join Node 20 and Node 22 evidence
    needs: [qualify-control]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Bind workflow definition and initialize authoritative tombstone
        shell: bash
        env:
          LAB013_SOURCE_SHA: ${{ inputs.source_sha }}
          LAB013_RECEIPT_PATH: ${{ runner.temp }}/lab013-control/receipt-authoritative.json
        run: |
          mkdir -p "$(dirname "$LAB013_RECEIPT_PATH")"
          source_json=null
          workflow_json=null
          [[ "$LAB013_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] && source_json="\"$LAB013_SOURCE_SHA\""
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] && workflow_json="\"$GITHUB_SHA\""
          printf '{\n  "schemaVersion": "1.0.0",\n  "kind": "lab013-control-qualification-failure",\n  "outcome": "rejected",\n  "failureCode": "source-preflight-failed",\n  "executedSourceSha": %s,\n  "workflowRefSha": %s,\n  "workflowRun": { "id": "%s", "url": "https://github.com/%s/actions/runs/%s", "attempt": %s },\n  "runtime": { "execution": "hosted", "platform": "linux", "nodeMajor": 22 },\n  "disclosure": "closed-aggregate-only"\n}\n' \
            "$source_json" "$workflow_json" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" >"$LAB013_RECEIPT_PATH"
          [[ "$source_json" != null ]]
          [[ "$GITHUB_SHA" == "$LAB013_SOURCE_SHA" ]]

      - name: Check out exact bound source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: No-dependency authoritative-join source and candidate-absence preflight
        shell: bash
        env:
          LAB013_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$LAB013_SOURCE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$LAB013_SOURCE_SHA" ]]
          git merge-base --is-ancestor a90d8a91aa0ec5f10796938798537aafc2ed0b9c "$LAB013_SOURCE_SHA"
          expected="$(cat <<'PATHS' | LC_ALL=C sort
          .github/workflows/lab013-control-qualification.yml
          bench/lab/ROADMAP.md
          bench/lab/datasets/__tests__/load-multihop-v2.test.ts
          bench/lab/datasets/load-multihop-v2.ts
          bench/lab/datasets/multihop/v2/dev/input.jsonl
          bench/lab/datasets/multihop/v2/dev/oracle.jsonl
          bench/lab/datasets/multihop/v2/holdout/input.jsonl
          bench/lab/datasets/multihop/v2/holdout/oracle.jsonl
          bench/lab/multihop/__tests__/qualify-control-v2.test.ts
          bench/lab/multihop/__tests__/scorer-only-v2.test.ts
          bench/lab/multihop/policy-v2.ts
          bench/lab/multihop/qualify-control-v2.ts
          bench/lab/multihop/scorer-only-v2.ts
          bench/lab/registry/datasets.json
          package.json
          PATHS
          )"
          actual="$(git diff --name-only a90d8a91aa0ec5f10796938798537aafc2ed0b9c "$LAB013_SOURCE_SHA" | LC_ALL=C sort)"
          [[ "$actual" == "$expected" ]]
          [[ "$(git rev-parse "$LAB013_SOURCE_SHA:bench/lab/adapters/memberry-retrieval-core.ts")" == 3ceda0bcc44a5e7a8d79356c5ec909451d426a02 ]]
          [[ "$(git rev-parse "$LAB013_SOURCE_SHA:bench/lab/registered-adapters.ts")" == 752bc02e4ef5aabe99a5c52699c2ead6e6395f83 ]]
          [[ "$(git rev-parse "$LAB013_SOURCE_SHA:bench/lab/runner.ts")" == c0b885845d117f1d6e7a25bbfc87832e97ddee77 ]]
          [[ "$(git rev-parse "$LAB013_SOURCE_SHA:bench/lab/registry/systems.json")" == 41ccf2b5e8a6c90d5f675d56c2b641126d151f82 ]]
          [[ "$(git rev-parse "$LAB013_SOURCE_SHA:bench/lab/registry/experiments.json")" == 9dda1d33d84611cdc9c388fb81df5d8a678798a2 ]]
          python3 - <<'PY'
          import json, re
          marker = re.compile(r"lab-?013|multi-?hop-v2|multihop-v2", re.I)
          def load(path):
              with open(path, encoding="utf-8") as handle:
                  return json.load(handle)
          systems = load("bench/lab/registry/systems.json")["systems"]
          experiments = load("bench/lab/registry/experiments.json")["experiments"]
          assert not any(marker.search(json.dumps(value, sort_keys=True)) for value in systems + experiments)
          datasets = [value for value in load("bench/lab/registry/datasets.json")["datasets"]
                      if str(value.get("id", "")).startswith("memberry-multihop-v2-")]
          assert {value["id"] for value in datasets} == {
              "memberry-multihop-v2-dev", "memberry-multihop-v2-holdout"
          }
          for value in datasets:
              split = value["split"]
              identities = {
                  f'{item.get("role")}|{item.get("access")}|{item.get("repositoryPath")}'
                  for item in value.get("artifacts", [])
              }
              assert identities == {
                  f"input|adapter|bench/lab/datasets/multihop/v2/{split}/input.jsonl",
                  f"oracle|scorer|bench/lab/datasets/multihop/v2/{split}/oracle.jsonl",
              }
          PY

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install frozen dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Prove join checkout remains exact and clean
        shell: bash
        env:
          LAB013_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$LAB013_SOURCE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$LAB013_SOURCE_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]

      - name: Download exactly Node 20 evidence
        id: download-node20
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lab013-control-node-evidence-node20-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab013-control/evidence/node20

      - name: Download exactly Node 22 evidence
        id: download-node22
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lab013-control-node-evidence-node22-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab013-control/evidence/node22

      - name: Emit sole authoritative joined qualification or rejection tombstone
        if: always()
        env:
          LAB013_SOURCE_SHA: ${{ inputs.source_sha }}
          LAB013_RECEIPT_PATH: ${{ runner.temp }}/lab013-control/receipt-authoritative.json
          LAB013_NODE20_EVIDENCE_PATH: ${{ runner.temp }}/lab013-control/evidence/node20/receipt-node20.json
          LAB013_NODE22_EVIDENCE_PATH: ${{ runner.temp }}/lab013-control/evidence/node22/receipt-node22.json
          LAB013_MATRIX_RESULT: ${{ needs.qualify-control.result }}
          MEMBERRY_LAB_CANDIDATE: "false"
        run: npm run bench:lab:multihop-v2:join-control

      - name: Upload sole authoritative closed receipt or tombstone
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab013-control-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab013-control/receipt-authoritative.json
          if-no-files-found: error
          retention-days: 30
