name: RET-010 one-shot holdout qualification

on:
  workflow_dispatch:
    inputs:
      qualification_sha:
        description: Exact approved qualification commit
        required: true
        type: string
      approval_digest:
        description: Canonical SHA-256 of the approved development record
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Validate immutable dispatch inputs
        shell: bash
        env:
          REQUESTED_QUALIFICATION_SHA: ${{ inputs.qualification_sha }}
          REQUESTED_APPROVAL_DIGEST: ${{ inputs.approval_digest }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_QUALIFICATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUESTED_APPROVAL_DIGEST" =~ ^[0-9a-f]{64}$ ]]

      - name: Check out exact qualification source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.qualification_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out source
        shell: bash
        env:
          REQUESTED_QUALIFICATION_SHA: ${{ inputs.qualification_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_QUALIFICATION_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]

      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install frozen dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build exact source
        run: npm run build

      - name: Reverify exact tracked source before qualification
        shell: bash
        env:
          REQUESTED_QUALIFICATION_SHA: ${{ inputs.qualification_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_QUALIFICATION_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=no)" ]]

      - name: Run closed RET-010 qualification gate
        id: ret010_holdout_gate
        shell: bash
        env:
          RET010_HOLDOUT_QUALIFICATION_SHA: ${{ inputs.qualification_sha }}
          RET010_HOLDOUT_APPROVAL_DIGEST: ${{ inputs.approval_digest }}
        run: |
          set -euo pipefail
          node --import tsx bench/lab/ret010/holdout-gate.mts run

      - name: Finalize closed RET-010 holdout evidence
        id: ret010_holdout_finalize
        if: ${{ always() }}
        shell: bash
        env:
          RET010_HOLDOUT_QUALIFICATION_SHA: ${{ inputs.qualification_sha }}
          RET010_HOLDOUT_APPROVAL_DIGEST: ${{ inputs.approval_digest }}
          RET010_HOLDOUT_GATE_OUTCOME: ${{ steps.ret010_holdout_gate.outcome }}
        run: |
          set -euo pipefail
          node --import tsx bench/lab/ret010/holdout-gate.mts finalize

      # The finalizer emits upload_path on its fallback path too, so a failed
      # finalize still publishes a content-free stage bundle instead of nothing.
      - name: Upload finalized RET-010 holdout evidence
        if: ${{ always() && steps.ret010_holdout_finalize.outputs.upload_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memberry-ret010-holdout-node-${{ matrix.node-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.ret010_holdout_finalize.outputs.upload_path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
