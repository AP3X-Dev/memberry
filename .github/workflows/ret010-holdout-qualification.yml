name: RET-010 one-shot holdout qualification

on:
  workflow_dispatch:
    inputs:
      qualification_sha:
        description: Exact approved qualification commit
        required: true
        type: string
      approval_digest:
        description: Canonical SHA-256 of the approved development record
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Validate immutable dispatch inputs
        shell: bash
        env:
          REQUESTED_QUALIFICATION_SHA: ${{ inputs.qualification_sha }}
          REQUESTED_APPROVAL_DIGEST: ${{ inputs.approval_digest }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_QUALIFICATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUESTED_APPROVAL_DIGEST" =~ ^[0-9a-f]{64}$ ]]

      - name: Check out exact qualification source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.qualification_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out source
        shell: bash
        env:
          REQUESTED_QUALIFICATION_SHA: ${{ inputs.qualification_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_QUALIFICATION_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]

      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install frozen dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build exact source
        run: npm run build

      - name: Reverify exact tracked source before qualification
        shell: bash
        env:
          REQUESTED_QUALIFICATION_SHA: ${{ inputs.qualification_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_QUALIFICATION_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=no)" ]]

      - name: Run closed RET-010 qualification gate
        shell: bash
        env:
          RET010_QUALIFICATION_SHA: ${{ inputs.qualification_sha }}
          RET010_APPROVAL_DIGEST: ${{ inputs.approval_digest }}
          RET010_HOLDOUT_RECEIPT_PATH: ${{ runner.temp }}/ret010-holdout-qualification/receipt-or-tombstone.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RET010_HOLDOUT_RECEIPT_PATH")"
          node --import tsx bench/lab/ret010/holdout-gate.mts

      - name: Upload closed aggregate receipt or tombstone
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ret010-holdout-qualification-node-${{ matrix.node-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ret010-holdout-qualification/receipt-or-tombstone.json
          if-no-files-found: error
          retention-days: 14
